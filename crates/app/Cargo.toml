[package]
name = "rogeha-reader"
description = "Rogeha Reader: a fast, free PDF and EPUB reader"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rogeha-core = { path = "../core" }
egui = { version = "0.37", default-features = false, features = ["default_fonts"] }
egui-winit = { version = "0.37", default-features = false, features = ["clipboard", "links", "wayland", "x11"] }
winit = "0.30"
softbuffer = "0.4"
# CPU rasteriser for egui (egui_software_backend ported to egui 0.37).
hdrshot-egui-backend = "0.2"
rfd = "0.15"
serde_json = "1"

[target.'cfg(windows)'.dependencies]
# The print dialog and drawing pages on a printer.
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Storage_Xps", "Win32_System_Registry", "Win32_UI_Controls_Dialogs", "Win32_UI_Shell"] }

[build-dependencies]
# Puts the icon and version details into the Windows program file.
winresource = "0.1"
