[package]
name = "rogeha-reader"
description = "Rogeha Reader: a fast, free PDF and EPUB reader"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rogeha-core = { path = "../core" }
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "clipboard", "wayland", "x11"] }
rfd = "0.15"
serde_json = "1"
