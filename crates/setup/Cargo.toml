[package]
name = "rogeha-setup"
description = "Installer for Rogeha Reader (Windows, per user, no administrator rights)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "rogeha-reader-setup"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
winresource = "0.1"
