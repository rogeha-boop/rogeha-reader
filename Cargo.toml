[workspace]
resolver = "3"
members = ["crates/core", "crates/app", "crates/agent", "crates/setup"]
# The installer packs the built reader, so it is built on request, after the others:
#   cargo build --release && cargo build --release -p rogeha-setup
default-members = ["crates/core", "crates/app", "crates/agent"]

[workspace.package]
version = "1.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
mupdf = { version = "0.8.0", default-features = false, features = ["js", "xps", "svg", "cbz", "img", "html", "epub", "tesseract", "brotli", "docx-output", "base14-fonts"] }

# Raw FFI, for the few MuPDF calls the safe wrapper does not expose. Same build as `mupdf` uses.
mupdf-sys = { version = "0.8.0", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

# Debug builds: optimise dependencies so MuPDF-heavy code isn't painfully slow.
[profile.dev.package."*"]
opt-level = 2
